services:
  - type: web
    name: oil-liquidity-sniper-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: KLINE_SYMBOL_LIMIT
        value: 30
      - key: NEWS_REFRESH_MS
        value: 300000
      - key: AI_REQUESTS_PER_DAY
        value: 12
