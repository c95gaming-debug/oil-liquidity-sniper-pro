
name: Extract mobile app source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          mkdir -p /tmp/oil-app
          unzip -q oil-liquidity-sniper-pro-mobile.zip -d /tmp/oil-app
          cp -a /tmp/oil-app/oil-liquidity-sniper-pro/. .
          rm -f oil-liquidity-sniper-pro-mobile.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mobile app source"
          git push
